name: Monthly Update on 27th at 00:00 Africa/Casablanca

on:
  schedule:
    - cron: "0 * 26,27 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prüfen, ob in Africa/Casablanca der 27. Tag um 00:00 Uhr ist
        id: schedule_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Start (workflow_dispatch) – Ausführung freigegeben."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_DAY_HM=$(TZ="Africa/Casablanca" date +"%d %H:%M")
          echo "Aktuelle Zeit in Africa/Casablanca (TT HH:MM): $CURRENT_DAY_HM"
          if [ "$CURRENT_DAY_HM" = "27 00:00" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python einrichten
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        if: steps.schedule_check.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Webseite aktualisieren und zu times umbenennen
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          TARGET_URL: https://www.habous.gov.ma
        run: python update_site.py

      - name: Änderungen committen und auf main pushen
        if: steps.schedule_check.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "Keine Änderungen erkannt – kein Commit nötig."
            exit 0
          fi

          STAMP=$(TZ="Africa/Casablanca" date +"%Y-%m-%d %H:%M %Z")
          git commit -m "chore: update times on 27th ($STAMP)"
          git push origin main
